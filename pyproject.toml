[project]
name = "tarr"
dynamic = ["version"]
description = "(qbit)torrent manager"
authors = [{ name = "William Huebner", email = "wilhueb@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "qbittorrent-api>=2026.6.1",
    "structlog>=26.1",
]

[project.urls]
Homepage = "https://github.com/wthueb/tarr"

[project.scripts]
tarr = "tarr:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jsonschema>=4.26",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
