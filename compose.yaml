services:
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - downloads:/downloads
      - incomplete:/incomplete
    ports:
      - 8080:8080

  tarr:
    container_name: tarr
    image: ghcr.io/wthueb/tarr:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ=America/New_York
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - downloads:/downloads
      - incomplete:/incomplete

volumes:
  qbittorrent-config:
  downloads:
  incomplete:
