logging:
  level: INFO
  # logfmt (default) or json
  format: logfmt
  # file: /var/log/tarr/tarr.log
  # file_count: 20

# how often to check when running with --daemon
interval_seconds: 60

# connection to the qBittorrent WebUI (connection settings only)
qbittorrent:
  host: http://localhost:8080
  username: admin
  password: adminadmin

# Optional named Radarr/Sonarr instances referenced by arr_verify_removal in any
# removal job's categories. Hosts may include a reverse-proxy base path.
arrs: {}
# arrs:
#   radarr:
#     host: http://radarr:7878
#     api_key: replace-me
#   radarr4k:
#     host: http://radarr4k:7878
#     api_key: replace-me

# delete torrents whose tracker reports them as "unregistered".
# waits `delay_minutes` after first seeing the status before deleting, since some
# trackers report it transiently.
remove_unregistered:
  enabled: true
  delay_minutes: 15
  # optionally, only consider torrents in these categories; omit or set to null
  # to consider every category. a list entry of null represents no category.
  categories: null
  # never remove torrents in these categories; a `null` entry means torrents
  # without a category (useful for torrents you are uploading)
  ignore_categories:
    - null
    - upload

# remove torrents after they have continuously appeared as completed and stopped for
# `delay_minutes`. actively seeding torrents are left alone; tracking starts when
# tarr first observes a completed torrent in a stopped state. removal also requires
# reaching the torrent's active qBittorrent seed-time OR ratio limit AND satisfying
# every matched tracker's required policy. No matching tracker means no removal.
# inherited defaults, manually defined limits, and limits applied by set_seed_limits
# are respected. set_seed_limits runs first; -1 is unlimited.
remove_stopped:
  enabled: false
  delay_minutes: 15
  # optionally, only consider torrents in these categories; omit or set to null
  # to consider every category. a list entry of null represents no category.
  categories: null
  # always exclude these categories, even if they also appear in categories
  ignore_categories: []
  # Remove keeps downloaded files; RemoveWithContent deletes them
  on_delete: Remove

# reconcile qBittorrent share limits for the categories listed below. Use each matched
# tracker's desired limits, taking the maximum per dimension (-1 means unlimited).
# A complete category override takes precedence. No tracker match means no changes.
set_seed_limits:
  enabled: true
  # Each category requires action: Default, Stop, Remove, RemoveWithContent,
  # or EnableSuperSeeding. There is no global action or inheritance.
  categories:
    - name: cross
      action: RemoveWithContent

    # Overrides require both fields, each at least every configured tracker's
    # corresponding required limit. -1 is unlimited and passes that comparison.
    - name: upload
      action: Stop
      override:
        seed_time_minutes: -1
        ratio: -1

    # Use Stop for Arr-verified categories; tarr performs guarded removal later.
    - name: radarr
      action: Stop

# once free space drops below `free_space_threshold_gibi`, remove eligible torrents
# (highest effective delete_priority first, then most swarm seeders) until the threshold
# is met. Effective priority is the MINIMUM across all matched trackers. Every matched
# tracker must pass its required seed-time OR ratio policy. No match means no removal.
maintain_free_space:
  enabled: true
  # only torrents in one of these categories are considered (set to null for all)
  categories:
    - name: autobrr
    # Use objects to verify every listed Arr queue before removal. Strings and null
    # are also accepted for categories without verification.
    # - name: radarr
    #   arr_verify_removal: [radarr, radarr4k]
  # always exclude these categories, even if they also appear in categories
  ignore_categories: []
  free_space_threshold_gibi: 1024

# prune old empty directories left after deletions performed by qBittorrent or other tools.
# requires locally mounted storage and write permissions; paths may differ via mappings.
# only immediate children are scanned; symlinks, nonempty directories, and paths referenced
# by any current torrent (regardless of category/state) are never removed.
cleanup_empty_dirs:
  enabled: false
  directories:
    # one path means identical paths in qBittorrent and tarr
    - /downloads/cross-seed
    # for different Docker mounts, replace the entry above with qBittorrent-path:tarr-path:
    # - "/downloads/cross-seed:/data/torrents/cross-seed"
  # glob matched against directory names; qui uses name--<8-character hash prefix>
  name_pattern: "*--????????"
  min_age_minutes: 60

# All configured trackers matching an announce hostname (including subdomains) apply.
# Required limits guard tarr removals except remove_unregistered. Desired limits are
# applied by set_seed_limits. Each desired field must be >= its corresponding required
# field at startup; equality is allowed. -1 means unlimited (greater than finite values),
# and that dimension never qualifies a torrent for removal. Both unlimited prevent removal.
trackers:
  - name: Example
    hosts:
      - tracker.example.org
    required:
      seed_time_minutes: 10080 # 7 days
      ratio: 1.0
    desired:
      seed_time_minutes: 20160 # 14 days
      ratio: 2.0
    # Effective priority is the minimum across matches; higher values are deleted first.
    # Defaults to 0; negative values are allowed. Priority never bypasses eligibility.
    delete_priority: 0
