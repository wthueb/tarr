name: ci

on:
  push:
    branches:
      - '**'
      - '!release-please--**'
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      format(
        'ci-{0}-{1}-{2}',
        github.event_name,
        github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name
          || github.repository,
        github.event_name == 'workflow_dispatch'
          && github.run_id
          || github.head_ref
          || github.ref_name
      )
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.route.outputs.publish }}
      run: ${{ steps.route.outputs.run }}

    steps:
      - name: Select pipeline
        id: route
        uses: actions/github-script@v9
        with:
          script: |
            const isPullRequest = context.eventName === "pull_request";
            const isManual = context.eventName === "workflow_dispatch";
            const isBranchPush = context.eventName === "push"
              && context.ref.startsWith("refs/heads/");
            const isInternalPullRequest = isPullRequest
              && context.payload.pull_request.head.repo?.full_name
                === context.payload.repository.full_name
              && context.actor !== "dependabot[bot]";

            let run = true;
            if (isBranchPush && context.ref !== "refs/heads/master") {
              const branch = context.ref.slice("refs/heads/".length);
              const pulls = await github.paginate(
                github.rest.pulls.list,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${context.repo.owner}:${branch}`,
                  state: "open",
                  per_page: 100,
                },
              );
              run = !pulls.some((pull) =>
                pull.head.repo?.full_name === context.payload.repository.full_name
                && pull.head.ref === branch
              );
            }

            core.setOutput("run", String(run));
            core.setOutput("publish", String(!isManual && (!isPullRequest || isInternalPullRequest)));

  python:
    name: Python checks
    if: needs.route.outputs.run == 'true'
    needs: route
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest

  build_amd64_image:
    name: Build tarr (amd64)
    if: needs.route.outputs.run == 'true'
    needs:
      - route
      - python
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      platform: linux/amd64
      platform_key: amd64
      runner: ubuntu-24.04
      publish: ${{ needs.route.outputs.publish == 'true' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build_arm64_image:
    name: Build tarr (arm64)
    if: needs.route.outputs.run == 'true'
    needs:
      - route
      - python
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      platform: linux/arm64
      platform_key: arm64
      runner: ubuntu-24.04-arm
      publish: ${{ needs.route.outputs.publish == 'true' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  e2e:
    name: End-to-end tests
    if: >-
      ${{
        needs.route.outputs.run == 'true' &&
        (github.event_name == 'pull_request' ||
         github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && github.ref == 'refs/heads/master'))
      }}
    needs:
      - route
      - python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: test
          tags: tarr:test
          load: true
          cache-from: |
            type=gha,scope=tarr-test-amd64
            type=gha,scope=tarr-amd64
          cache-to: type=gha,mode=max,ignore-error=true,scope=tarr-test-amd64

      - name: Run end-to-end tests
        shell: bash
        run: |
          mkdir -p e2e-artifacts
          docker compose -f compose.e2e.yaml run --rm --use-aliases tests 2>&1 | tee e2e-artifacts/tests.log

      - name: Collect Docker diagnostics
        if: always()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f compose.e2e.yaml ps --all > e2e-artifacts/services.txt
          docker compose -f compose.e2e.yaml logs --no-color > e2e-artifacts/compose.log 2>&1

      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: e2e-artifacts/
          retention-days: 7

      - name: Clean up end-to-end environment
        if: always()
        run: docker compose -f compose.e2e.yaml down --volumes --remove-orphans

  publish:
    name: Publish tarr
    if: >-
      ${{
        always() &&
        needs.route.outputs.publish == 'true' &&
        needs.python.result == 'success' &&
        needs.build_amd64_image.result == 'success' &&
        needs.build_arm64_image.result == 'success' &&
        (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      }}
    needs:
      - route
      - python
      - build_amd64_image
      - build_arm64_image
      - e2e
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: tarr-amd64-digest
          path: ${{ runner.temp }}/digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: tarr-arm64-digest
          path: ${{ runner.temp }}/digests/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            wthueb/tarr
            ghcr.io/${{ github.repository_owner }}/tarr
          tags: |
            type=ref,event=branch,enable=${{ !startsWith(github.ref_name, 'release-please--') }}
            type=ref,event=pr
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
          labels: |
            org.opencontainers.image.title=tarr
            org.opencontainers.image.description=(qbit)torrent manager
          annotations: |
            org.opencontainers.image.title=tarr
            org.opencontainers.image.description=(qbit)torrent manager

      - name: Assemble and verify multi-platform image
        shell: bash
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          amd64_digest="sha256:$(basename "$(find "${RUNNER_TEMP}/digests/amd64" -type f -print -quit)")"
          arm64_digest="sha256:$(basename "$(find "${RUNNER_TEMP}/digests/arm64" -type f -print -quit)")"

          annotation_args=()
          while IFS= read -r annotation; do
            if [[ -n "${annotation}" ]]; then
              annotation_args+=(--annotation "${annotation}")
            fi
          done <<< "${ANNOTATIONS}"

          create_index() {
            local image_name="$1"
            local metadata_file="$2"
            local tag_args=()

            while IFS= read -r image_tag; do
              tag_args+=(--tag "${image_tag}")
            done < <(
              jq -r --arg prefix "${image_name}:" \
                '.tags[] | select(startswith($prefix))' <<< "${METADATA_JSON}"
            )

            if (( ${#tag_args[@]} == 0 )); then
              echo "No tags generated for ${image_name}" >&2
              return 1
            fi

            docker buildx imagetools create \
              "${tag_args[@]}" \
              "${annotation_args[@]}" \
              --metadata-file "${metadata_file}" \
              "${image_name}@${amd64_digest}" \
              "${image_name}@${arm64_digest}"
          }

          verify_index() {
            local image_name="$1"
            local metadata_file="$2"
            local image_digest
            local image_index

            image_digest="$(jq -r '."containerimage.descriptor".digest' "${metadata_file}")"
            image_index="$(docker buildx imagetools inspect --raw "${image_name}@${image_digest}")"
            jq -e '
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64")
              and any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' <<< "${image_index}"
          }

          create_index "wthueb/tarr" "${RUNNER_TEMP}/dockerhub-metadata.json"
          create_index \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tarr" \
            "${RUNNER_TEMP}/ghcr-metadata.json"
          verify_index "wthueb/tarr" "${RUNNER_TEMP}/dockerhub-metadata.json"
          verify_index \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tarr" \
            "${RUNNER_TEMP}/ghcr-metadata.json"
