name: tarr-e2e

x-tarr: &tarr
  image: ${TARR_E2E_IMAGE:-tarr:test}
  pull_policy: never

services:
  seed:
    <<: *tarr
    build:
      context: .
      target: test
    user: root
    network_mode: none
    entrypoint: [python, /app/e2e/seed.py]
    volumes:
      - downloads:/downloads
      - qbittorrent-config:/config

  qbittorrent:
    image: linuxserver/qbittorrent:5.2.3
    environment:
      PUID: '1000'
      PGID: '1000'
      WEBUI_PORT: '8080'
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/v2/app/version]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - downloads:/downloads
      - qbittorrent-config:/config

  tests:
    <<: *tarr
    init: true
    depends_on:
      qbittorrent:
        condition: service_healthy
    volumes:
      - downloads:/downloads
      - downloads:/readonly:ro

networks:
  default:
    internal: true

volumes:
  downloads:
  qbittorrent-config:
